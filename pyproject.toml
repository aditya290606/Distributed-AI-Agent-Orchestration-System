[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-ai-agent-orchestrator"
version = "0.1.0"
description = "A production-oriented Distributed AI Agent Orchestration System built with FastAPI, LangGraph, Gemini API, Redis, PostgreSQL, and Celery."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Engineering Team" }
]
keywords = ["ai-agents", "langgraph", "fastapi", "gemini", "celery", "distributed-systems"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "alembic>=1.13.0",
    "google-genai>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.5",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "B008", # Do not perform function call in argument defaults (FastAPI Depends)
    "E501", # Line length handled by formatter
    "UP046", # Allow Generic[T] with Pydantic BaseModel
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = "-v --strict-markers -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
